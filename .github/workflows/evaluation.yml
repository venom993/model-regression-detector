name: LLM Regression Evaluation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: write
  pull-requests: write
  issues: write


jobs:

  evaluate:

    runs-on:
      - self-hosted
      - Windows
      - X64


    steps:

      # ==============================================
      # CHECKOUT
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================================
      # SETUP PYTHON
      # ==============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==============================================
      # INSTALL DEPENDENCIES
      # ==============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==============================================
      # RUN EVALUATION
      # ==============================================

      - name: Run evaluation
        id: evaluation
        continue-on-error: true

        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        run: |
          python -m app.runner


            # ==============================================
      # CREATE OR UPDATE PULL REQUEST COMMENT
      # ==============================================

      - name: Create or Update Pull Request Comment

        if: always() && github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require('fs');

            const comparison = JSON.parse(
              fs.readFileSync(
                'reports/regression_comparison.json',
                'utf8'
              )
            );


            const previousAccuracy =
              comparison.previous_accuracy ?? 'N/A';

            const currentAccuracy =
              comparison.current_accuracy ?? 'N/A';

            const accuracyDelta =
              comparison.delta ?? 'N/A';


            const previousLatency =
              comparison.previous_average_latency ?? 'N/A';

            const currentLatency =
              comparison.current_average_latency ?? 'N/A';

            const latencyDelta =
              comparison.latency_delta ?? 'N/A';


            const previousSimilarity =
              comparison.previous_average_similarity ?? 'N/A';

            const currentSimilarity =
              comparison.current_average_similarity ?? 'N/A';

            const similarityDelta =
              comparison.similarity_delta ?? 'N/A';


            const regressions =
              comparison.regressions?.length ?? 0;

            const improvements =
              comparison.improvements?.length ?? 0;


            const overallStatus =
              comparison.status === 'CRITICAL' ||
              comparison.latency_status === 'CRITICAL' ||
              comparison.similarity_status === 'CRITICAL'
                ? '🔴 CRITICAL'
                : '🟢 PASSED';


            const body = `<!-- llm-regression-report -->

            ## 🤖 LLM Regression Evaluation

            ### Overall Status

            **${overallStatus}**

            ---

            ### 🎯 Accuracy

            | Metric | Value |
            |---|---|
            | Previous Accuracy | ${previousAccuracy}% |
            | Current Accuracy | ${currentAccuracy}% |
            | Delta | ${accuracyDelta}% |
            | Status | **${comparison.status}** |

            ---

            ### ⚡ Performance

            | Metric | Value |
            |---|---|
            | Previous Avg Latency | ${previousLatency} seconds |
            | Current Avg Latency | ${currentLatency} seconds |
            | Delta | ${latencyDelta}% |
            | Status | **${comparison.latency_status}** |

            ---

            ### 🧠 Semantic Similarity

            | Metric | Value |
            |---|---|
            | Previous Avg Similarity | ${previousSimilarity} |
            | Current Avg Similarity | ${currentSimilarity} |
            | Delta | ${similarityDelta}% |
            | Status | **${comparison.similarity_status}** |

            ---

            ### 🔍 Case Changes

            🔴 **Regressions:** ${regressions}

            🟢 **Improvements:** ${improvements}
            `;


            // ==========================================
            // FIND EXISTING REGRESSION COMMENT
            // ==========================================

            const comments =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });


            const existingComment =
              comments.data.find(
                comment =>
                  comment.body.includes(
                    '<!-- llm-regression-report -->'
                  )
              );


            // ==========================================
            // UPDATE EXISTING COMMENT
            // ==========================================

            if (existingComment) {

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });

              console.log(
                'Updated existing LLM regression comment.'
              );

            }

            // ==========================================
            // CREATE NEW COMMENT
            // ==========================================

            else {

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });

              console.log(
                'Created new LLM regression comment.'
              );

            }

      # ==============================================
      # FAIL CI ON CRITICAL REGRESSION
      # ==============================================

      - name: Fail CI on critical regression

        if: always() && steps.evaluation.outcome == 'failure'

        run: |

          Write-Host "Critical regression detected."

          exit 1


      # ==============================================
      # COMMIT EVALUATION HISTORY
      # ==============================================

      - name: Commit evaluation history

        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

        shell: powershell

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add history/


          if (git diff --cached --quiet) {

            Write-Host "No new history files to commit."

           }

          else {

            git commit -m "Update evaluation history"

            git push origin HEAD:main

           }


      # ==============================================
      # UPLOAD REPORTS
      # ==============================================

      - name: Upload reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: evaluation-report

          path: reports/