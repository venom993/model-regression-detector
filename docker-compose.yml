services:
  regression-detector:
    build: .
    container_name: model-regression-detector

    environment:
      LLM_PROVIDER: ollama
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(os.environ['OLLAMA_HOST'] + '/api/tags', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      - ./history:/app/history
      - ./reports:/app/reports